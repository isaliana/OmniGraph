<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniGraph</title>
  <meta name="description" content="OmniGraph — an interactive character relationship explorer. Choose your universe." />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #111420 0%, #050608 100%);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      color: white;
    }

    #landing-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hub-title {
      font-family: 'Cinzel', serif;
      font-size: 42px;
      color: #c8a96e;
      letter-spacing: 0.15em;
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(200, 169, 110, 0.4);
    }

    .hub-subtitle {
      font-family: 'Lato', sans-serif;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.2em;
      margin-bottom: 60px;
    }

    .portal-container {
      display: flex;
      gap: 40px;
    }

    .portal-card {
      width: 280px;
      height: 400px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 30px 20px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .portal-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-url) center/cover no-repeat;
      opacity: 0.4;
      transition: opacity 0.4s;
      z-index: -1;
    }

    .portal-card:hover {
      transform: translateY(-10px);
      border-color: rgba(200, 169, 110, 0.5);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .portal-card:hover::before {
      opacity: 0.7;
    }

    .portal-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      color: white;
      text-align: center;
      margin-bottom: 8px;
    }

    .portal-desc {
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .sw-portal-card::before {
      background:
        radial-gradient(ellipse 90% 85% at 50% 50%, rgba(0,0,0,0) 30%, rgba(0,0,5,0.85) 75%, #00000a 100%),
        radial-gradient(1px 1px at 8% 6%, #fff, rgba(0,0,0,0)),
        radial-gradient(0.8px 0.8px at 22% 14%, rgba(255,255,255,0.9), rgba(0,0,0,0)),
        radial-gradient(1.2px 1.2px at 78% 8%, #fff, rgba(0,0,0,0)),
        radial-gradient(0.7px 0.7px at 90% 22%, rgba(255,255,255,0.7), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 5% 42%, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(0.8px 0.8px at 15% 78%, rgba(255,255,255,0.6), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 92% 65%, rgba(200,220,255,0.5), rgba(0,0,0,0)),
        radial-gradient(0.6px 0.6px at 55% 5%, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 38% 88%, rgba(255,255,255,0.6), rgba(0,0,0,0)),
        radial-gradient(0.8px 0.8px at 68% 82%, rgba(180,200,255,0.5), rgba(0,0,0,0)),
        url('assets/starwar/DeathStar.png') center / cover no-repeat,
        linear-gradient(160deg, #00000a 0%, #060610 40%, #000005 100%);
      opacity: 0.75;
    }

    .sw-portal-card:hover::before {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="landing-page">
    <div class="hub-title">OMNIGRAPH</div>
    <div class="hub-subtitle">SELECT A UNIVERSE</div>

    <div class="portal-container">
      <a href="karamazov.html" class="portal-card" style="--bg-url: url('assets/background.jpg');">
        <div class="portal-title">The Brothers Karamazov</div>
        <div class="portal-desc">Dostoevsky's Russian Classic</div>
      </a>

      <a href="starwars.html" class="portal-card sw-portal-card">
        <div class="portal-title">Star Wars</div>
        <div class="portal-desc">The Original Trilogy</div>
      </a>
    </div>
  </div>

</body>
</html>
